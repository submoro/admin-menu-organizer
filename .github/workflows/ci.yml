name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # SPEC 10.5: phpcs against WordPress, WordPress-Extra, WordPress-Docs and
  # PHPCompatibilityWP with testVersion 7.4-. Must report zero errors.
  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run phpcs
        run: composer run lint -- --report-full --report-checkstyle=./phpcs-report.xml

      - name: Annotate the diff with any violations
        if: ${{ failure() }}
        run: cs2pr ./phpcs-report.xml

      - name: Validate readme.txt
        if: ${{ always() }}
        run: composer run check:readme

  # The real PHP 7.4 guarantee.
  #
  # PHPCompatibility 9.3.5 is the current stable release and predates PHP 8.0,
  # so it cannot detect PHP 8 syntax at all. Running phpcs with
  # testVersion 7.4- therefore proves far less than it appears to. Parsing every
  # shipped file with an actual PHP 7.4 binary is the only deterministic check,
  # and unlike the test suite it covers files no test happens to execute.
  syntax-php74:
    name: PHP 7.4 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint every shipped file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=${file}::$(php -l "$file" 2>&1 | head -n1)"
              status=1
            fi
          done < <(find . -name '*.php' \
                     -not -path './vendor/*' \
                     -not -path './node_modules/*' \
                     -not -path './docs/recon/*')
          exit "${status}"

  # The WordPress-independent suite. No database, so it is fast and runs across
  # the full PHP range as an early signal.
  unit-tests:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run the unit suite
        run: composer run test:unit

  # SPEC 15: the suite must pass on PHP 7.4, 8.1 and 8.3, against both the
  # declared WordPress floor and current stable.
  integration-tests:
    name: Integration / PHP ${{ matrix.php }} / WP ${{ matrix.wordpress }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.4'
          - php: '8.1'
            wordpress: 'latest'
          - php: '8.3'
            wordpress: '6.4'
          - php: '8.3'
            wordpress: 'latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Install the WordPress test library
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail

          TESTS_DIR="${RUNNER_TEMP}/wordpress-tests-lib"
          CORE_DIR="${RUNNER_TEMP}/wordpress"
          mkdir -p "${TESTS_DIR}" "${CORE_DIR}"

          if [ "${WP_VERSION}" = "latest" ]; then
            WP_TAG=$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ \
              | php -r 'echo json_decode(stream_get_contents(STDIN), true)["offers"][0]["current"];')
          else
            WP_TAG="${WP_VERSION}"
          fi
          # The two sources disagree on how a .0 release is named. wordpress.org
          # ships it as wordpress-6.4.tar.gz, while every wordpress-develop tag
          # is three-part, so 6.4 exists only as 6.4.0 there. Asking GitHub for
          # a "6.4" tag returns 404, which is what broke both WP 6.4 jobs while
          # the "latest" jobs, resolving to a three-part 7.0.2, passed.
          if [[ "${WP_TAG}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            WP_DEVELOP_TAG="${WP_TAG}.0"
          else
            WP_DEVELOP_TAG="${WP_TAG}"
          fi

          echo "Core tarball: ${WP_TAG}   test library tag: ${WP_DEVELOP_TAG}"

          # Core, from the official release tarball.
          curl -fsSL "https://wordpress.org/wordpress-${WP_TAG}.tar.gz" \
            | tar --strip-components=1 -zxf - -C "${CORE_DIR}"

          # The test library, from the matching develop tag.
          #
          # strip-components must be 3, not 2. The archive paths are
          # wordpress-develop-<tag>/tests/phpunit/includes/..., so stripping two
          # components leaves the library at ${TESTS_DIR}/phpunit/includes,
          # one level below where the bootstrap looks for it. tar still exits 0,
          # so the mistake surfaces only as "could not find the test library".
          curl -fsSL "https://github.com/WordPress/wordpress-develop/archive/refs/tags/${WP_DEVELOP_TAG}.tar.gz" \
            | tar --strip-components=3 -zxf - -C "${TESTS_DIR}" \
              "wordpress-develop-${WP_DEVELOP_TAG}/tests/phpunit/includes" \
              "wordpress-develop-${WP_DEVELOP_TAG}/tests/phpunit/data"

          test -f "${TESTS_DIR}/includes/functions.php" \
            || { echo "::error::Test library layout unexpected"; find "${TESTS_DIR}" -maxdepth 2 -type d; exit 1; }

          # Written here rather than sed-ed out of wp-tests-config-sample.php,
          # whose internal paths change between releases.
          cat > "${TESTS_DIR}/wp-tests-config.php" <<PHPEOF
          <?php
          define( 'ABSPATH', '${CORE_DIR}/' );
          define( 'WP_DEFAULT_THEME', 'default' );
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', 'php' );
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', '' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_DEBUG', true );
          \$table_prefix = 'wptests_';
          PHPEOF

          echo "WP_TESTS_DIR=${TESTS_DIR}" >> "${GITHUB_ENV}"

      - name: Run the integration suite
        run: composer run test:integration

  # SPEC 10.5: the official Plugin Check plugin, both check sets, zero errors.
  #
  # Runs against the BUILT PLUGIN, not the repository. Pointing it at the repo
  # root makes it audit the test suite, the build scripts, the recon harnesses,
  # .github and SPEC.md — none of which ship — and it duly reported missing
  # ABSPATH guards in PHPUnit tests, mt_rand() in a property-based test, and
  # "hidden files are not permitted" for .gitattributes. All noise, and it
  # drowned the two findings that were real.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build the distributable
        run: |
          set -euo pipefail
          php bin/build-zip.php "${RUNNER_TEMP}/dist"
          mkdir -p "${RUNNER_TEMP}/plugin"
          unzip -q "${RUNNER_TEMP}"/dist/*.zip -d "${RUNNER_TEMP}/plugin"
          echo "Checking these files:"
          find "${RUNNER_TEMP}/plugin" -type f | sed "s!${RUNNER_TEMP}/plugin/!  !"

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/plugin/admin-menu-categories
          categories: |
            general
            plugin_repo
            security
            accessibility
            performance

  # SPEC 15: zero outbound HTTP requests. Belt and braces alongside the runtime
  # pre_http_request assertion, this fails the build if any of the forbidden
  # network primitives appear in shipped code at all.
  no-outbound-requests:
    name: No outbound requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the plugin contains no network calls
        run: |
          set -euo pipefail

          PATTERN='wp_remote_|curl_init|curl_exec|fsockopen|file_get_contents\s*\(\s*["'"'"']https\?:|fopen\s*\(\s*["'"'"']https\?:'

          # Only shipped code is in scope, so every directory .distignore
          # excludes is excluded here too. bin/ matters especially:
          # bin/security-audit.php holds this very pattern as a string literal,
          # so scanning it made the check match its own detector and fail.
          if grep -rnE "${PATTERN}" \
               --include='*.php' --include='*.js' \
               --exclude-dir=vendor --exclude-dir=node_modules \
               --exclude-dir=docs --exclude-dir=tests --exclude-dir=bin \
               --exclude-dir=.github \
               . ; then
            echo "::error::Found an outbound network call in shipped code. SPEC section 8 forbids this."
            exit 1
          fi

          echo "No outbound network calls found."
