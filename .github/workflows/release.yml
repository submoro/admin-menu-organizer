name: Release

# Pushing a v* tag publishes the release. Nothing is built from a branch, so a
# release always corresponds to an immutable tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The changelog extractor reads files, not history. Tags are fetched
          # regardless, because the next step verifies the ref really is a tag here
          # and cannot do that without them.
          fetch-depth: 1
          fetch-tags: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # The tag is the one thing no test can check, because the tests do not know
      # what it is. Everything else about the version is already covered by
      # tests/unit/test-version-consistency.php, which asserts the plugin header,
      # AMORG_VERSION and the readme's Stable tag agree — so proving the tag
      # matches the header transitively proves it matches all three.
      #
      # workflow_dispatch takes free text, so the tag reaches this job as
      # attacker-controllable input in a job holding contents: write. It is passed
      # through env rather than interpolated into the script: a `${{ }}` expansion
      # is substituted before bash parses the line, so a value like `v$(...)` would
      # be executed. As an env var it is only ever data. The shape is then checked
      # and the ref confirmed to exist, so nothing downstream acts on a value that
      # is not a real tag in this repository.
      - name: Verify the tag matches the plugin version
        id: version
        env:
          TARGET_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$TARGET_REF"

          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "::error::Refusing to release '$tag': expected a v<version> tag."
              exit 1
              ;;
          esac

          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::'$tag' is not a tag in this repository."
            exit 1
          fi

          version="${tag#v}"
          header=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\(.*\)$/\1/p' \
                     admin-menu-categories.php | head -n1 | tr -d '[:space:]')

          printf 'tag=%s\ntag version=%s\nplugin header=%s\n' "$tag" "$version" "$header"

          if [ "$version" != "$header" ]; then
            echo "::error::Tag $tag does not match the plugin header version $header. Bump the version, or retag."
            exit 1
          fi

          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"

      # A release is the one artefact users install directly, so it is gated on
      # the same checks CI runs, minus the integration suite: that needs MySQL and
      # has already passed on the commit this tag points at.
      - name: Coding standards
        run: composer run lint

      - name: Unit suite
        run: composer run test:unit

      - name: Validate readme.txt
        run: composer run check:readme

      - name: Security audit
        run: composer run audit

      - name: Build the distribution zip
        id: build
        run: |
          set -euo pipefail
          php bin/build-zip.php build
          zip=$(ls build/*.zip | head -n1)
          test -s "${zip}"
          echo "zip=${zip}" >> "${GITHUB_OUTPUT}"
          echo "Built ${zip} ($(stat -c%s "${zip}") bytes)"

      # readme.txt is the source of truth, so the release and the WordPress.org
      # changelog cannot describe the same version differently. Exits non-zero if
      # the changelog has no entry for this version, which fails the release
      # rather than publishing empty notes.
      - name: Compose release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          php bin/release-notes.php "$VERSION" > release-notes.md
          {
            echo
            echo "Full changelog and upgrade notes are in [readme.txt](readme.txt)."
          } >> release-notes.md
          cat release-notes.md

      # gh is preinstalled on the runner, so this needs no third-party action —
      # worth keeping for a plugin that ships a zip people install.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating notes and replacing the asset."
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file release-notes.md
            gh release upload "$tag" "$RELEASE_ZIP" --clobber
          else
            gh release create "$tag" "$RELEASE_ZIP" \
              --title "$tag" \
              --notes-file release-notes.md
          fi

          gh release view "${tag}"
